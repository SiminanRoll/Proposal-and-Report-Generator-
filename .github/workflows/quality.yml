name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        shell: bash
        run: |
          set +e
          node --test --test-reporter=tap tests/*.test.mjs 2>&1 | tee /tmp/client-compass-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            while IFS= read -r failure; do
              echo "::error title=Client Compass test failure::$failure"
            done < <(grep '^not ok' /tmp/client-compass-tests.log | head -20)
          fi
          exit "$status"
      - name: Build
        run: npm run build
