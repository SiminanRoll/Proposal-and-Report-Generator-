name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Repair withdrawn merge2 lock entry
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const lockPath = "package-lock.json";
          const lock = JSON.parse(fs.readFileSync(lockPath, "utf8"));
          const merge2 = lock.packages?.["node_modules/merge2"];

          if (merge2?.version === "1.4.2") {
            merge2.version = "1.4.1";
            merge2.resolved = "https://registry.npmjs.org/merge2/-/merge2-1.4.1.tgz";
            fs.writeFileSync(lockPath, `${JSON.stringify(lock, null, 2)}\n`);
          }
          NODE
      - run: npm ci
      - run: npm run verify
