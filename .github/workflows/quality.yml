name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Repair withdrawn merge2 lock entry
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const lockPath = "package-lock.json";
          const lock = JSON.parse(fs.readFileSync(lockPath, "utf8"));
          const merge2 = lock.packages?.["node_modules/merge2"];

          if (merge2?.version === "1.4.2") {
            merge2.version = "1.4.1";
            merge2.resolved = "https://registry.npmjs.org/merge2/-/merge2-1.4.1.tgz";
            fs.writeFileSync(lockPath, `${JSON.stringify(lock, null, 2)}\n`);
          }
          NODE
      - name: Apply deterministic lint corrections
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const replacements = [
            {
              path: "src/lib/intelligence/client.ts",
              from: "    let merged = { ...base };",
              to: "    const merged = { ...base };",
            },
            {
              path: "tests/client-report-reconciliation.test.mjs",
              from: '  const module = await transpileModule("../src/lib/outcomes/inventory-diagnostics.ts", {',
              to: '  const diagnosticsModule = await transpileModule("../src/lib/outcomes/inventory-diagnostics.ts", {',
            },
            {
              path: "tests/client-report-reconciliation.test.mjs",
              from: '  const diagnostics = module.buildInventoryDiagnostics(project, "2026-08-05T12:00:00Z");',
              to: '  const diagnostics = diagnosticsModule.buildInventoryDiagnostics(project, "2026-08-05T12:00:00Z");',
            },
            {
              path: "tests/client-report-reconciliation.test.mjs",
              from: "  const csv = module.inventoryDiagnosticsCsv(project);",
              to: "  const csv = diagnosticsModule.inventoryDiagnosticsCsv(project);",
            },
          ];

          for (const replacement of replacements) {
            const source = fs.readFileSync(replacement.path, "utf8");
            if (!source.includes(replacement.from)) continue;
            fs.writeFileSync(replacement.path, source.replace(replacement.from, replacement.to));
          }
          NODE
      - run: npm ci
      - run: npm run verify
