name: Main Check

on:
  push:
    branches: [main]

concurrency:
  group: client-compass-main
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Signal polling regression
        run: node --test tests/signal-dashboard-polling.test.mjs
      - run: npm run build
      - run: npm test
