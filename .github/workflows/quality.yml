name: Main Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: client-compass-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Signal and OTA regressions
        run: node --test tests/signal-dashboard-polling.test.mjs tests/signal-dashboard-version-contract.test.mjs tests/ota-performance-isolation.test.mjs tests/ota-stats-logic.test.mjs tests/ota-tracker-logic.test.mjs
      - run: npm run build
      - name: Legacy full suite
        continue-on-error: true
        run: npm test
