name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Package source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: client-compass-v10926-source
          path: |
            .
            !.git
            !node_modules
            !.next
            !out
            !coverage
          include-hidden-files: true
          compression-level: 6
