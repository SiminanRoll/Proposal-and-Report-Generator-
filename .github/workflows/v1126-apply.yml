name: Apply v1.1.26 lifecycle fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[v1126-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply v1.1.26 source changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s), found {count}: {old!r}")
              p.write_text(text.replace(old, new, expected), encoding="utf-8")
              print(f"updated {path}: {old!r} -> {new!r}")

          # Compass settings defaults.
          replace_exact("src/lib/compass/config.ts", "    workstationPlanSoonYears: 5,", "    workstationPlanSoonYears: 4,")
          replace_exact("src/lib/compass/config.ts", "    workstationReplaceNowYears: 7,", "    workstationReplaceNowYears: 5,")
          replace_exact("src/lib/compass/config.ts", "    workstationExpiredWarrantyReplaceYears: 6,", "    workstationExpiredWarrantyReplaceYears: 5,")

          old_migration = '''  // v1.2.2 stored the original 4/5-year workstation defaults and had no card definitions.\n  // Upgrade only those exact legacy defaults; deliberate custom threshold values remain intact.\n  if (!Array.isArray(candidate.cards)) {\n    if (normalizedThresholds.workstationPlanSoonYears === 4) normalizedThresholds.workstationPlanSoonYears = DEFAULT_COMPASS_CONFIG.thresholds.workstationPlanSoonYears;\n    if (normalizedThresholds.workstationReplaceNowYears === 5) normalizedThresholds.workstationReplaceNowYears = DEFAULT_COMPASS_CONFIG.thresholds.workstationReplaceNowYears;\n  }'''
          new_migration = '''  // v1.1.26 restores the intended workstation lifecycle contract: 4+ Plan Soon, 5+ Replace Now.\n  // Migrate only the exact prior 5/7/6 default tuple; deliberate custom thresholds remain intact.\n  const priorFiveSevenDefaults =\n    normalizedThresholds.workstationPlanSoonYears === 5\n    && normalizedThresholds.workstationReplaceNowYears === 7\n    && normalizedThresholds.workstationExpiredWarrantyReplaceYears === 6;\n  if (priorFiveSevenDefaults) {\n    normalizedThresholds.workstationPlanSoonYears = 4;\n    normalizedThresholds.workstationReplaceNowYears = 5;\n    normalizedThresholds.workstationExpiredWarrantyReplaceYears = 5;\n  }'''
          replace_exact("src/lib/compass/config.ts", old_migration, new_migration)

          # Shared technical truth used by both Compass and client-facing report inventory.
          replace_exact("src/lib/technical-truth/index.ts", "export const TECHNICAL_TRUTH_VERSION = 1;", "export const TECHNICAL_TRUTH_VERSION = 2;")
          replace_exact("src/lib/technical-truth/index.ts", "  workstationPlanSoonYears: 5,", "  workstationPlanSoonYears: 4,")
          replace_exact("src/lib/technical-truth/index.ts", "  workstationReplaceNowYears: 7,", "  workstationReplaceNowYears: 5,")
          replace_exact("src/lib/technical-truth/index.ts", "  workstationExpiredWarrantyReplaceYears: 6,", "  workstationExpiredWarrantyReplaceYears: 5,")
          replace_exact(
              "src/lib/technical-truth/index.ts",
              '  const months = technicalFutureMonths(input.warrantyEnd, referenceDate);\n  if (age >= thresholds.workstationPlanSoonYears || (age >= 4 && months !== null && months >= 0 && months <= thresholds.warrantyPlanningMonths)) return "plan-soon";',
              '  if (age >= thresholds.workstationPlanSoonYears) return "plan-soon";',
          )

          # Force existing calculated datasets to refresh under the corrected lifecycle contract.
          replace_exact("src/lib/compass/engine.ts", "export const COMPASS_CALCULATION_VERSION = 5;", "export const COMPASS_CALCULATION_VERSION = 6;")

          # App version. package.json + package-lock.json are updated below with npm version.
          replace_exact("src/lib/app-version.ts", 'export const APP_VERSION = "1.1.25";', 'export const APP_VERSION = "1.1.26";')

          # Update the two report lifecycle fixtures that contain a 5.8-year workstation.
          replace_exact(
              "tests/lifecycle-policy.test.mjs",
              "    current: 1,\n    dueSoon: 2,\n    overdue: 0,",
              "    current: 1,\n    dueSoon: 1,\n    overdue: 1,",
              expected=2,
          )

          Path("tests/v1126-workstation-lifecycle-thresholds.test.mjs").write_text(textwrap.dedent(r'''
            import test from "node:test";
            import assert from "node:assert/strict";
            import { transpileTestModule } from "./test-transpile-helper.mjs";

            test("v1.1.26 restores the 4-year Plan Soon and 5-year Replace Now settings defaults", async () => {
              const { DEFAULT_COMPASS_CONFIG, normalizeCompassConfig } = await transpileTestModule("../src/lib/compass/config.ts", import.meta.url, { prefix: "v1126-config" });
              assert.equal(DEFAULT_COMPASS_CONFIG.thresholds.workstationPlanSoonYears, 4);
              assert.equal(DEFAULT_COMPASS_CONFIG.thresholds.workstationReplaceNowYears, 5);
              assert.equal(DEFAULT_COMPASS_CONFIG.thresholds.workstationExpiredWarrantyReplaceYears, 5);

              const oldDefaults = structuredClone(DEFAULT_COMPASS_CONFIG);
              oldDefaults.thresholds.workstationPlanSoonYears = 5;
              oldDefaults.thresholds.workstationReplaceNowYears = 7;
              oldDefaults.thresholds.workstationExpiredWarrantyReplaceYears = 6;
              const migrated = normalizeCompassConfig(oldDefaults);
              assert.equal(migrated.thresholds.workstationPlanSoonYears, 4);
              assert.equal(migrated.thresholds.workstationReplaceNowYears, 5);
              assert.equal(migrated.thresholds.workstationExpiredWarrantyReplaceYears, 5);

              const custom = structuredClone(DEFAULT_COMPASS_CONFIG);
              custom.thresholds.workstationPlanSoonYears = 6;
              custom.thresholds.workstationReplaceNowYears = 8;
              custom.thresholds.workstationExpiredWarrantyReplaceYears = 8;
              const preserved = normalizeCompassConfig(custom);
              assert.equal(preserved.thresholds.workstationPlanSoonYears, 6);
              assert.equal(preserved.thresholds.workstationReplaceNowYears, 8);
              assert.equal(preserved.thresholds.workstationExpiredWarrantyReplaceYears, 8);
            });

            test("shared lifecycle truth classifies the exact workstation boundaries", async () => {
              const { DEFAULT_TECHNICAL_THRESHOLDS, classifyTechnicalLifecycle } = await transpileTestModule("../src/lib/technical-truth/index.ts", import.meta.url, { prefix: "v1126-truth" });
              const base = { deviceType: "physical-workstation", isVirtual: false, model: "Dell OptiPlex 7090" };
              assert.equal(classifyTechnicalLifecycle({ ...base, ageYears: 3.99 }), "current");
              assert.equal(classifyTechnicalLifecycle({ ...base, ageYears: 4.0 }), "plan-soon");
              assert.equal(classifyTechnicalLifecycle({ ...base, ageYears: 4.8 }), "plan-soon");
              assert.equal(classifyTechnicalLifecycle({ ...base, ageYears: 4.99 }), "plan-soon");
              assert.equal(classifyTechnicalLifecycle({ ...base, ageYears: 5.0 }), "replace-now");
              assert.equal(classifyTechnicalLifecycle({ ...base, ageYears: 5.6 }), "replace-now");

              const custom = { ...DEFAULT_TECHNICAL_THRESHOLDS, workstationPlanSoonYears: 6, workstationReplaceNowYears: 8, workstationExpiredWarrantyReplaceYears: 8 };
              assert.equal(classifyTechnicalLifecycle({ ...base, ageYears: 4.8, warrantyEnd: "2099-01-01" }, custom), "current");
              assert.equal(classifyTechnicalLifecycle({ ...base, ageYears: 6.0, warrantyEnd: "2099-01-01" }, custom), "plan-soon");
              assert.equal(classifyTechnicalLifecycle({ ...base, ageYears: 8.0, warrantyEnd: "2099-01-01" }, custom), "replace-now");
            });
          ''').lstrip(), encoding="utf-8")
          PY

          npm version 1.1.26 --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Verify v1.1.26
        run: npm run verify

      - name: Commit verified v1.1.26 to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v1126-apply.yml
          git add src/lib/compass/config.ts src/lib/technical-truth/index.ts src/lib/compass/engine.ts src/lib/app-version.ts package.json package-lock.json tests/lifecycle-policy.test.mjs tests/v1126-workstation-lifecycle-thresholds.test.mjs
          git commit -m "fix: ship v1.1.26 workstation lifecycle policy [v1126-applied]"
          git push origin HEAD:main
