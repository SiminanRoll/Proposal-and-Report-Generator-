name: Simplify v1.2.78 client report language

on:
  push:
    branches:
      - client-compass-v1278-release
    paths:
      - '.github/workflows/v1278-simplify-report.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply client-facing simplification
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}")
              return text.replace(old, new)

          outcome_path = Path('src/components/outcome-experience.tsx')
          outcome = outcome_path.read_text()
          replacements = [
              ('if (value === "lifecycle") return "Network health";', 'if (value === "lifecycle") return "Equipment age";', 'section label'),
              ('<span className="presentation-kicker">Network health & equipment age</span>', '<span className="presentation-kicker">Equipment age & replacement planning</span>', 'lifecycle kicker'),
              ('<span className="overdue"><b><AnimatedNumber value={lifecycle.overdue} delay={570} /></b> Health priorities</span>', '<span className="overdue"><b><AnimatedNumber value={lifecycle.overdue} delay={570} /></b> Replace now</span>', 'lifecycle overdue label'),
              ('<span className="presentation-kicker">Health priority details</span><h3>{sourceReportedReplacementCount} system{sourceReportedReplacementCount === 1 ? "" : "s"} need age-based planning</h3>', '<span className="presentation-kicker">Replace now</span><h3>{sourceReportedReplacementCount} system{sourceReportedReplacementCount === 1 ? " is" : "s are"} at replacement age</h3>', 'replacement heading'),
              ('<span className={healthPriorities ? "attention" : "healthy"}><strong><AnimatedNumber value={healthPriorities} delay={510} /></strong><b>Health priorities</b></span>', '<span className={lifecycle.overdue ? "risk" : "healthy"}><strong><AnimatedNumber value={lifecycle.overdue} delay={510} /></strong><b>Replace now</b></span>', 'planning replace now'),
              ('<span className={osSupport.attention ? "attention" : "healthy"}><strong><AnimatedNumber value={osSupport.attention} delay={620} /></strong><b>OS support concerns</b></span>', '<span className={osSupport.attention ? "risk" : "healthy"}><strong><AnimatedNumber value={osSupport.attention} delay={620} /></strong><b>OS concerns</b></span>', 'planning OS red'),
              ('<article className={healthPriorities ? "attention" : "healthy"}><strong><AnimatedNumber value={healthPriorities} delay={420} /></strong><span>Health priorities</span><small>{healthPriorities ? approach.mode === "purchase-planning" ? "Computers to plan for replacement" : "Items to discuss in the planning session" : "No age-based action required"}</small></article>', '<article className={lifecycle.overdue ? "risk" : "healthy"}><strong><AnimatedNumber value={lifecycle.overdue} delay={420} /></strong><span>Replace now</span><small>{lifecycle.overdue ? "Systems at replacement age" : "No systems at replacement age"}</small></article>', 'recap replace now'),
              ('<article className={osSupport.attention ? "attention" : "healthy"}><strong><AnimatedNumber value={osSupport.attention} delay={455} /></strong><span>OS support concerns</span>', '<article className={osSupport.attention ? "risk" : "healthy"}><strong><AnimatedNumber value={osSupport.attention} delay={455} /></strong><span>OS concerns</span>', 'recap OS red'),
          ]
          for old, new, label in replacements:
              outcome = replace_once(outcome, old, new, label)
          outcome_path.write_text(outcome)

          pdf_path = Path('src/lib/outcomes/export-html.ts')
          pdf = pdf_path.read_text()
          pdf_replacements = [
              ('<span>Network & lifecycle</span>', '<span>Network & equipment age</span>', 'pdf overview age label'),
              ('${lifecycle.unknown} need lifecycle data', '${lifecycle.unknown} need age data', 'pdf age data wording'),
              ('<span><b>${lifecycle.overdue}</b>Health priorities</span>', '<span><b>${lifecycle.overdue}</b>Replace now</span>', 'pdf legend replace now'),
              ('<article class="overdue"><strong>${lifecycle.overdue}</strong><span>Health priorities</span><small>Review by business impact and timing</small></article>', '<article class="overdue"><strong>${lifecycle.overdue}</strong><span>Replace now</span><small>Plan replacement by business impact and timing</small></article>', 'pdf lifecycle replace now'),
              ('<div class="replacement-overview"><h3>Priority systems</h3>', '<div class="replacement-overview"><h3>Replace now</h3>', 'pdf replacement heading'),
              ('<span><strong>${healthPriorities}</strong>health priorities</span>', '<span><strong>${lifecycle.overdue}</strong>replace now</span>', 'pdf planning context'),
              ('<article class="${healthPriorities ? "attention" : "healthy"}"><strong>${healthPriorities}</strong><span>Health priorities</span><small>${approach.mode === "purchase-planning" ? "Plan for replacement" : "Discuss during the planning session"}</small></article>', '<article class="${lifecycle.overdue ? "risk" : "healthy"}"><strong>${lifecycle.overdue}</strong><span>Replace now</span><small>${lifecycle.overdue ? "Systems at replacement age" : "No systems at replacement age"}</small></article>', 'pdf recap replace now'),
              ('<article class="${osSummary.attention ? "attention" : "healthy"}"><strong>${osSummary.attention}</strong><span>OS support concerns</span>', '<article class="${osSummary.attention ? "risk" : "healthy"}"><strong>${osSummary.attention}</strong><span>OS concerns</span>', 'pdf recap OS red'),
          ]
          for old, new, label in pdf_replacements:
              pdf = replace_once(pdf, old, new, label)
          pdf_path.write_text(pdf)
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Focused v1.2.78 tests
        run: node --test tests/v1278-report-clarity-budget.test.mjs
      - name: Build
        run: npm run build
      - name: Commit simplified report source
        shell: bash
        run: |
          git config user.name "Client Compass Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/outcome-experience.tsx src/lib/outcomes/export-html.ts
          git commit -m "Simplify client report attention language"
          git push origin HEAD:client-compass-v1278-release
