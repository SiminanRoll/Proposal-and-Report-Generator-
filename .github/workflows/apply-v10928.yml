name: Apply Client Compass v1.0.9.28

on:
  push:
    branches:
      - agent/client-compass-v1.0.9.28-segment-map

permissions:
  contents: write

jobs:
  apply-release:
    if: ${{ !contains(github.event.head_commit.message, 'Finalize Client Compass v1.0.9.28') && !contains(github.event.head_commit.message, 'Capture v1.0.9.28 test failure') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply v1.0.9.28 changes
        run: node scripts/apply-v10928.mjs
      - name: Align regression expectations
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const legacyTest = 'tests/v10927-os-segments-inventory.test.mjs';
          let legacy = fs.readFileSync(legacyTest, 'utf8');
          legacy = legacy.replace('assert.match(editor, /lifecycle, OS, owner/);', 'assert.match(editor, /device age, device counts/);');
          fs.writeFileSync(legacyTest, legacy);

          const newTest = 'tests/v10928-segment-units-map-pan.test.mjs';
          let current = fs.readFileSync(newTest, 'utf8');
          current = current.replace('assert.match(mapPage, /viewBox={viewBoxForZoom\\(zoom, pan\\)}/);', 'assert.ok(mapPage.includes("viewBox={viewBoxForZoom(zoom, pan)}"));');
          fs.writeFileSync(newTest, current);
          fs.rmSync('v10928-test-output.txt', { force: true });
          NODE
      - name: Remove one-time apply files
        run: rm scripts/apply-v10928.mjs .github/workflows/apply-v10928.yml
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        shell: bash
        run: |
          set +e
          npm test > v10928-test-output.txt 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            git config user.name "SiminanRoll"
            git config user.email "actions@users.noreply.github.com"
            git add v10928-test-output.txt
            git commit -m "Capture v1.0.9.28 test failure"
            git push origin HEAD:${GITHUB_REF_NAME}
            exit "$status"
          fi
          rm -f v10928-test-output.txt
      - name: Build
        run: npm run build
      - name: Remove generated build noise
        run: |
          git checkout -- next-env.d.ts tsconfig.json package-lock.json || true
      - name: Commit v1.0.9.28
        run: |
          git config user.name "SiminanRoll"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Finalize Client Compass v1.0.9.28"
          git push origin HEAD:${GITHUB_REF_NAME}
