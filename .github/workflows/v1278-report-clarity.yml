name: Finalize v1.2.78 Client Compass report updates

on:
  push:
    paths:
      - '.github/workflows/v1278-report-clarity.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply final report patch
        shell: bash
        run: |
          cp src/lib/outcomes/pdf-inventory-sync.ts /tmp/pdf-inventory-sync-main.ts
          python scripts/apply-v1278-report-clarity.py
          cp /tmp/pdf-inventory-sync-main.ts src/lib/outcomes/pdf-inventory-sync.ts
          python scripts/finalize-v1278-branch.py
      - name: Typecheck
        run: npm run typecheck
      - name: v1.2.78 focused regressions
        run: node --test tests/v1278-report-clarity-budget.test.mjs
      - name: Main Check regression subset
        run: node --test tests/signal-dashboard-polling.test.mjs tests/signal-dashboard-version-contract.test.mjs tests/ota-performance-isolation.test.mjs tests/ota-stats-logic.test.mjs tests/ota-tracker-logic.test.mjs
      - name: Build
        run: npm run build
      - name: Legacy full suite
        continue-on-error: true
        run: npm test
      - name: Commit verified source changes to recovery branch
        shell: bash
        run: |
          git config user.name "Client Compass Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/outcome-experience.tsx src/components/technology-budget-outlook.tsx src/lib/outcomes/export-html.ts src/lib/outcomes/pdf-inventory-sync.ts src/lib/outcomes/technology-budget-outlook.ts src/lib/app-version.ts package.json tests/v1278-report-clarity-budget.test.mjs
          git commit -m "Complete v1.2.78 Client Report budget outlook" || true
          git push origin HEAD:client-compass-v1278-final
