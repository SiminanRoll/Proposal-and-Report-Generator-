name: One-shot Permit Output Taxonomy

on:
  push:
    paths:
      - '.github/workflows/one-shot-permit-output-taxonomy.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply permit output terminology
        run: python .github/patch_permit_output_taxonomy.py
      - name: Install dependencies
        run: npm ci
      - name: Verify permit output taxonomy
        run: node --test tests/signal-permit-output-taxonomy.test.mjs
      - name: Verify signal dashboard contracts
        run: node --test tests/signal-dashboard-polling.test.mjs tests/signal-dashboard-version-contract.test.mjs tests/signal-lead-first-ordering.test.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Verify diff
        run: git diff --check
      - name: Commit release and clean staging helpers
        run: |
          git config user.name "Signal Intelligence Release Bot"
          git config user.email "actions@github.com"
          git rm .github/patch_permit_output_taxonomy.py .github/workflows/one-shot-permit-output-taxonomy.yml
          git add public/captains-log-dashboard/dashboard-runtime-fixes.js tests/signal-permit-output-taxonomy.test.mjs
          git diff --cached --check
          git commit -m "fix(signals): give permit outputs project terminology"
          git push origin HEAD:main
