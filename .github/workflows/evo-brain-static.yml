name: EVO Brain existing-app acceptance
on:
  pull_request:
    paths:
      - "src/app/evo-brain/**"
      - "tests/evo-brain-browser.cjs"
      - ".github/workflows/evo-brain-static.yml"
  push:
    branches: [main]
    paths:
      - "src/app/evo-brain/**"
      - "tests/evo-brain-browser.cjs"
      - ".github/workflows/evo-brain-static.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-build-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install existing project dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint, typecheck and build the full Client Compass static export
        run: |
          npm run lint
          npm run typecheck
          npm run build
      - name: Install browser test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Check EVO login and interface in desktop and mobile Chromium
        run: node tests/evo-brain-browser.cjs
      - name: Verify Oyster public login page and deployed EVO release
        continue-on-error: true
        run: |
          set -euo pipefail
          HOST=oyster-app-xql5x.ondigitalocean.app
          EXPECTED_RELEASE=$(grep -oE 'data-evo-release="EVO-[0-9]+"' src/app/evo-brain/page.tsx | head -1 | cut -d '"' -f 2)
          test -n "$EXPECTED_RELEASE" || { echo "::error::Missing EVO release marker in source"; exit 1; }
          PAGE="https://$HOST/evo-brain/"
          echo "Verifying actual EVO Oyster hostname, HTTPS and public login route (not authenticated owner content)."
          if ! HTTP=$(curl --silent --show-error --location --max-time 25 --output /tmp/evo-live.html --write-out '%{http_code}' "$PAGE"); then
            echo "::warning::Oyster public page could not be reached via DNS/TLS/network; production deployment remains UNVERIFIED."
            echo "EVO production: UNVERIFIED - Oyster host not reachable over HTTPS from the CI runner." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$HTTP" != "200" ]; then
            echo "::warning::Oyster returned HTTP $HTTP; production release remains UNVERIFIED."
            echo "EVO production: UNVERIFIED - Oyster HTTP $HTTP." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if grep -q "data-evo-release=\"$EXPECTED_RELEASE\"" /tmp/evo-live.html; then
            echo "Oyster public login HTML contains the expected release marker: $EXPECTED_RELEASE"
            echo "EVO public production: release $EXPECTED_RELEASE verified on $PAGE (owner login still unverified)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Oyster returned HTTP 200 without the expected release marker; the new EVO build may not have deployed."
            echo "EVO public production: STALE or UNVERIFIED - HTTP 200, missing $EXPECTED_RELEASE marker at $PAGE." >> "$GITHUB_STEP_SUMMARY"
          fi
          # Never print page HTML, tokens or session content into Actions logs.
      - name: Save app screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evo-brain-client-compass-screenshots
          path: artifacts/evo-brain/
          if-no-files-found: ignore
