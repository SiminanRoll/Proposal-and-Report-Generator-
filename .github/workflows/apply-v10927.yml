name: Apply Client Compass v1.0.9.27

on:
  push:
    branches:
      - agent/client-compass-v1.0.9.27-os-segmentation

permissions:
  contents: write

jobs:
  apply-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify and apply v1.0.9.27 source patch
        shell: bash
        run: |
          echo "d652d36e33c62853126c34361fee16c653171ab995fd0ea7cccc04435f646f6a  .github/v10927.patch.gz.b64" | sha256sum -c -
          base64 -d .github/v10927.patch.gz.b64 | gunzip > /tmp/v10927.patch
          git apply --check -p1 /tmp/v10927.patch
          git apply -p1 /tmp/v10927.patch
          rm .github/v10927.patch.gz.b64
          rm .github/workflows/apply-v10927.yml
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Commit v1.0.9.27
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Client Compass v1.0.9.27 OS segmentation and GPU inventory"
          git push origin HEAD:${GITHUB_REF_NAME}
