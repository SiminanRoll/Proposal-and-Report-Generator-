name: v1.2.80 Red Budget Branch Check

on:
  push:
    branches:
      - client-compass-v1280-red-budget

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client-compass-v1280-red-budget
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Default budget toggle on
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/outcome-experience.tsx')
          text = path.read_text()
          old = 'const [includeTechnologyBudgetOutlook, setIncludeTechnologyBudgetOutlook] = useState(false);'
          new = 'const [includeTechnologyBudgetOutlook, setIncludeTechnologyBudgetOutlook] = useState(true);'
          if old not in text and new not in text:
              raise SystemExit('Budget toggle state line not found')
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
          PY
      - run: npm ci
      - run: npm run typecheck
      - name: Focused red-budget regressions
        run: node --test tests/v1278-report-clarity-budget.test.mjs
      - run: npm run build
      - name: Commit default-on toggle
        run: |
          if git diff --quiet; then
            echo "No source patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/outcome-experience.tsx
          git commit -m "Default Technology Budget on [v1280-bot]"
          git push origin HEAD:client-compass-v1280-red-budget
