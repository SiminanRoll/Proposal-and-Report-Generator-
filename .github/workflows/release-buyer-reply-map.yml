name: Release Buyer Reply Map

# Triggered 2026-08-25 for the Phase 2 Signal taxonomy correction.
on:
  push:
    paths:
      - '.github/workflows/release-buyer-reply-map.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply compact lane split
        run: python .github/compact_buyer_reply_map.py
      - name: Install dependencies
        run: npm ci
      - name: Verify Buyer Reply lane contract
        run: node --test tests/signal-map-buyer-reply-lanes.test.mjs
      - name: Verify dynamic route contract
        run: node --test tests/signal-route-dynamic-spine.test.mjs
      - name: Run full dashboard tests
        run: npm run test
      - name: Run typecheck
        run: npm run typecheck
      - name: Verify diff
        run: git diff --check
      - name: Commit release and clean staging helpers
        run: |
          git config user.name "Signal Intelligence Release Bot"
          git config user.email "actions@github.com"
          git rm .github/compact_buyer_reply_map.py .github/workflows/release-buyer-reply-map.yml
          git add public/captains-log-dashboard tests
          git diff --cached --check
          git commit -m "Split qualified signals into Buyer and Reply lanes"
          git push origin HEAD:main
