name: v1.2.84 Inventory Hardware Columns

on:
  push:
    branches:
      - client-compass-v1284-inventory-hardware-columns

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client-compass-v1284-inventory-hardware-columns
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply compact hardware columns
        run: python scripts/apply-v1284-inventory-hardware-columns.py
      - run: npm ci
      - run: npm run typecheck
      - name: Focused inventory regressions
        run: node --test tests/v1284-inventory-hardware-columns.test.mjs
      - run: npm run build
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src/lib/app-version.ts src/lib/outcomes/export-html.ts src/lib/outcomes/pdf-inventory-sync.ts tests/v1284-inventory-hardware-columns.test.mjs
          git commit -m "Add compact CPU memory and storage columns to PDF inventory [v1284-bot]"
          git push origin HEAD:client-compass-v1284-inventory-hardware-columns
