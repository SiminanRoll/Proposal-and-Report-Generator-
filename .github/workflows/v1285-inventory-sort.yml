name: v1.2.85 Inventory Sort Check

on:
  push:
    branches:
      - client-compass-v1285-inventory-sort

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client-compass-v1285-inventory-sort
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply inventory sorting
        run: python scripts/apply-v1285-inventory-sort.py
      - run: npm ci
      - run: npm run typecheck
      - name: Focused inventory sorting regressions
        run: node --test tests/v1285-inventory-sort.test.mjs
      - run: npm run build
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src/lib/app-version.ts src/lib/outcomes/pdf-inventory-sync.ts tests/v1285-inventory-sort.test.mjs
          git commit -m "Sort PDF inventory by priority and age [v1285-bot]"
          git push origin HEAD:client-compass-v1285-inventory-sort
