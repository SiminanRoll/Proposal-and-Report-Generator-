name: Bryan Content Review

on:
  pull_request:
    branches: [main]
    paths:
      - "src/app/content/**"
      - "src/components/content-review-workspace.tsx"
      - "src/components/content-review-workspace.module.css"
      - "src/lib/compass/content-review-live.ts"
      - "src/components/client-compass-runtime.tsx"
      - "tests/content-review-live.test.mjs"
      - ".github/workflows/content-review.yml"
  push:
    branches: [main]
    paths:
      - "src/app/content/**"
      - "src/components/content-review-workspace.tsx"
      - "src/components/content-review-workspace.module.css"
      - "src/lib/compass/content-review-live.ts"
      - "src/components/client-compass-runtime.tsx"
      - "tests/content-review-live.test.mjs"
      - ".github/workflows/content-review.yml"

jobs:
  content-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --test tests/content-review-live.test.mjs
      - run: npm run build
