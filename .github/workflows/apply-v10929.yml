          @media(max-width:700px){.map-lens-card-stack{grid-template-columns:1fr}.map-lens-picker{position:fixed;left:14px;right:14px;bottom:18px;width:auto;max-height:55vh}}
          EOF

          cat > tests/v10929-map-segment-lens.test.mjs <<'EOF'
          import test from "node:test";
          import assert from "node:assert/strict";
          import fs from "node:fs";

          const bridge = fs.readFileSync(new URL("../src/components/map-selection-group-bridge.tsx", import.meta.url), "utf8");
          const lens = fs.readFileSync(new URL("../src/lib/segments/map-lens.ts", import.meta.url), "utf8");
          const territory = fs.readFileSync(new URL("../src/lib/compass/territory-map.ts", import.meta.url), "utf8");
          const css = fs.readFileSync(new URL("../src/app/v10929-polish.css", import.meta.url), "utf8");
          const layout = fs.readFileSync(new URL("../src/app/layout.tsx", import.meta.url), "utf8");

          test("v1.0.9.29 map lenses consume saved Segment Manager definitions", () => {
            assert.match(bridge, /useSegments\(\)/);
            assert.match(bridge, /From Segment Manager/);
            assert.match(bridge, /SegmentIcon/);
            assert.match(lens, /client-compass\.segments\.v1/);
            assert.match(lens, /segmentIncludesClient/);
            assert.match(territory, /filterCompassDatasetForMapLens/);
          });

          test("map lenses support ALL ANY and additive state scope", () => {
            assert.match(lens, /matchMode === "any" \? matches\.some\(Boolean\) : matches\.every\(Boolean\)/);
            assert.match(bridge, />ALL<\/button>/);
            assert.match(bridge, />ANY<\/button>/);
            assert.match(bridge, /states: current\.states\.includes\(state\)/);
            assert.match(bridge, /pointerdown/);
            assert.match(bridge, /Math\.hypot/);
            assert.match(bridge, /toggleState\(press\.state\)/);
          });

          test("main page-title sections share the Report Generator stamped treatment", () => {
            assert.match(css, /\.compass-admin-hero/);
            assert.match(css, /\.territory-map-header/);
            assert.match(css, /\.segment-page-header/);
            assert.match(css, /\.segment-detail-header/);
            assert.match(css, /color:rgba\(68,88,111,\.27\)/);
            assert.match(css, /text-shadow:0 1px 0 rgba\(255,255,255,\.96\),0 -1px 0 rgba\(42,61,83,\.13\)/);
            assert.match(layout, /v10929-polish\.css/);
          });
          EOF

          cat > RELEASE_NOTES_v1.0.9.29.md <<'EOF'
          # Client Compass v1.0.9.29

          - Adds reusable Map lenses powered only by saved Segment Manager definitions; there is no second map-specific segment system.
          - Allows multiple segment cards to combine with ALL or ANY logic, so combinations such as Server 2012 + Windows 10, quote status, review status, and other saved segments can be visualized geographically.
          - Makes state selection an additive WHERE scope on the map, including reliable selection while zoomed and panning.
          - Keeps Clients, Need, and Value as the three map concentration views after segment and geography filtering.
          - Matches map segment cards to the compact saved-segment card language used in the navigation menu.
          - Standardizes top-level Client Compass page titles on the quiet embossed/stamped gray Report Generator treatment.
          EOF

          node <<'NODE'
          const fs = require("node:fs");

          function read(file) { return fs.readFileSync(file, "utf8"); }
          function write(file, content) { fs.writeFileSync(file, content); }
          function replaceOnce(file, before, after, label) {
            const source = read(file);
            if (!source.includes(before)) throw new Error(`Missing ${label} in ${file}`);
            write(file, source.replace(before, after));
          }

          const territoryFile = "src/lib/compass/territory-map.ts";
          let territory = read(territoryFile);
          if (!territory.includes('filterCompassDatasetForMapLens')) {
            territory = territory.replace('import type { CompassClient, CompassDataset } from "./types";', 'import { filterCompassDatasetForMapLens } from "@/lib/segments/map-lens";\nimport type { CompassClient, CompassDataset } from "./types";');
            const marker = 'export function buildTerritoryMapSnapshot(dataset: CompassDataset, criteria: TerritoryMapCriteria = DEFAULT_TERRITORY_MAP_CRITERIA): TerritoryMapSnapshot {';
            const start = territory.indexOf(marker);
            if (start < 0) throw new Error("Missing territory snapshot function");
            const head = territory.slice(0, start);
            let body = territory.slice(start);
            body = body.replace(marker, `${marker}\n  const mapDataset = filterCompassDatasetForMapLens(dataset);`);
            body = body.replaceAll('dataset.', 'mapDataset.');
            body = body.replaceAll('classifyClient(assignment.client.id, dataset)', 'classifyClient(assignment.client.id, mapDataset)');
            territory = head + body;
            write(territoryFile, territory);
          }

          replaceOnce("src/app/layout.tsx", 'import "./v10928-polish.css";', 'import "./v10928-polish.css";\nimport "./v10929-polish.css";', "v10929 stylesheet import");
          replaceOnce("src/lib/app-version.ts", 'export const APP_VERSION = "1.0.9.28";', 'export const APP_VERSION = "1.0.9.29";', "app version");
          replaceOnce("package.json", '"version": "1.0.9.28"', '"version": "1.0.9.29"', "package version");

          for (const name of fs.readdirSync("tests")) {
            if (!name.endsWith(".test.mjs")) continue;
            const file = `tests/${name}`;
            let source = read(file);
            source = source.replaceAll("1.0.9.28", "1.0.9.29");
            source = source.replaceAll("1\\\\.0\\\\.9\\\\.28", "1\\\\.0\\\\.9\\\\.29");
            write(file, source);
          }
          NODE

          rm .github/workflows/apply-v10929.yml
      - name: Install
