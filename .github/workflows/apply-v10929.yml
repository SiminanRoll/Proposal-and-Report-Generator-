name: Apply Client Compass v1.0.9.29

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-release:
    if: ${{ !contains(github.event.head_commit.message, 'Client Compass v1.0.9.29 map lenses') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply v1.0.9.29
        shell: bash
        run: |
          cat > src/lib/segments/map-lens.ts <<'EOF'
          import type { CompassDataset } from "@/lib/compass/types";
          import { buildSegmentClientMetrics, segmentIncludesClient } from "./engine";
          import type { SegmentDefinition } from "./types";

          export type MapSegmentMatchMode = "all" | "any";

          export interface MapLensState {
            segmentIds: string[];
            matchMode: MapSegmentMatchMode;
            states: string[];
          }

          export const MAP_LENS_STORAGE_KEY = "client-compass.map-lens.v1";
          export const MAP_LENS_CHANGE_EVENT = "client-compass-map-lens-changed";
          const SEGMENT_STORAGE_KEY = "client-compass.segments.v1";

          export const EMPTY_MAP_LENS_STATE: MapLensState = { segmentIds: [], matchMode: "all", states: [] };

          export function normalizeMapLensState(value: unknown): MapLensState {
            const row = value && typeof value === "object" ? value as Partial<MapLensState> : {};
            return {
              segmentIds: Array.isArray(row.segmentIds) ? [...new Set(row.segmentIds.map(String).filter(Boolean))] : [],
              matchMode: row.matchMode === "any" ? "any" : "all",
              states: Array.isArray(row.states) ? [...new Set(row.states.map((state) => String(state).trim().toUpperCase()).filter(Boolean))] : [],
            };
          }

          export function loadMapLensState(): MapLensState {
            if (typeof window === "undefined") return EMPTY_MAP_LENS_STATE;
            try { return normalizeMapLensState(JSON.parse(window.localStorage.getItem(MAP_LENS_STORAGE_KEY) || "null")); }
            catch { return EMPTY_MAP_LENS_STATE; }
          }

          export function saveMapLensState(state: MapLensState): void {
            if (typeof window === "undefined") return;
            const normalized = normalizeMapLensState(state);
            window.localStorage.setItem(MAP_LENS_STORAGE_KEY, JSON.stringify(normalized));
            window.dispatchEvent(new Event(MAP_LENS_CHANGE_EVENT));
            window.dispatchEvent(new Event("client-compass-data-changed"));
          }

          function savedSegments(): SegmentDefinition[] {
            if (typeof window === "undefined") return [];
            try {
              const parsed = JSON.parse(window.localStorage.getItem(SEGMENT_STORAGE_KEY) || "[]") as unknown;
              if (!Array.isArray(parsed)) return [];
              return parsed.filter((item): item is SegmentDefinition => Boolean(item && typeof item === "object" && String((item as SegmentDefinition).id || "") && String((item as SegmentDefinition).title || "")));
            } catch { return []; }
          }

          export function mapLensClientIds(dataset: CompassDataset, state: MapLensState, segments: SegmentDefinition[]): Set<string> {
            const normalized = normalizeMapLensState(state);
            const activeSegments = normalized.segmentIds.map((id) => segments.find((segment) => segment.id === id)).filter((segment): segment is SegmentDefinition => Boolean(segment));
            const stateScope = new Set(normalized.states);
            const ids = new Set<string>();

            for (const client of dataset.clients) {
              const clientState = String(client.state || "").trim().toUpperCase();
              if (stateScope.size && !stateScope.has(clientState)) continue;
              if (!activeSegments.length) { ids.add(client.id); continue; }
              const metrics = buildSegmentClientMetrics(dataset, client.id);
              if (!metrics) continue;
              const matches = activeSegments.map((segment) => segmentIncludesClient(segment, metrics));
              const included = normalized.matchMode === "any" ? matches.some(Boolean) : matches.every(Boolean);
              if (included) ids.add(client.id);
            }
            return ids;
          }

          export function filterCompassDatasetForMapLens(dataset: CompassDataset): CompassDataset {
            if (typeof window === "undefined" || !String(window.location?.pathname || "").startsWith("/map")) return dataset;
            const state = loadMapLensState();
            if (!state.segmentIds.length && !state.states.length) return dataset;
            const ids = mapLensClientIds(dataset, state, savedSegments());
            return {
              ...dataset,
              clients: dataset.clients.filter((client) => ids.has(client.id)),
              locations: dataset.locations.filter((location) => ids.has(location.clientId)),
              devices: dataset.devices.filter((device) => ids.has(device.clientId)),
              findings: dataset.findings.filter((finding) => ids.has(finding.clientId)),
              summaries: dataset.summaries.filter((summary) => ids.has(summary.clientId)),
            };
          }
          EOF

          cat > src/components/map-selection-group-bridge.tsx <<'EOF'
          "use client";

          import Link from "next/link";
          import { createPortal } from "react-dom";
          import { useCallback, useEffect, useMemo, useRef, useState } from "react";
          import type { CSSProperties } from "react";
          import { useCompassState } from "@/lib/compass/store";
          import { buildSegmentSnapshot } from "@/lib/segments/engine";
          import { EMPTY_MAP_LENS_STATE, loadMapLensState, normalizeMapLensState, saveMapLensState, type MapLensState } from "@/lib/segments/map-lens";
          import { useSegments } from "@/lib/segments/store";
          import { SegmentIcon } from "./segment-icon";

          const STATE_SELECTION_GROUPS = [
            ["TN", "KY", "AL"],
            ["IN", "OH"],
          ] as const;

          type PointerPress = { pointerId: number; state: string; x: number; y: number; moved: boolean };

          function compactMoney(value: number): string {
            if (value >= 1_000_000) return `$${(value / 1_000_000).toFixed(value >= 10_000_000 ? 0 : 1).replace(/\.0$/, "")}M`;
            if (value >= 1_000) return `$${Math.round(value / 1_000)}K`;
            return new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 }).format(value);
          }

          function stateCodeForGroup(group: Element): string {
            const label = group.querySelector<SVGTextElement>(".territory-map-region-label")?.textContent?.trim().toUpperCase() ?? "";
            return label.slice(0, 2);
          }

          function stateCodeFromTarget(target: EventTarget | null): string {
            if (!(target instanceof Element)) return "";
            const group = target.closest(".territory-map-state");
            return group ? stateCodeForGroup(group) : "";
          }

          function syncPeerHighlights(map: Element) {
            const activeState = map.querySelector(".territory-map-state.is-active");
            const activeCode = activeState ? stateCodeForGroup(activeState) : "";
            const selectionGroup = STATE_SELECTION_GROUPS.find((states) => states.includes(activeCode as never));
            map.querySelectorAll<SVGGElement>(".territory-map-state").forEach((node) => {
              const code = stateCodeForGroup(node);
              const shouldHighlight = Boolean(selectionGroup && code !== activeCode && selectionGroup.includes(code as never));
              node.classList.toggle("is-selection-peer-active", shouldHighlight);
            });
          }

          function syncLensHighlights(map: Element, states: string[]) {
            const selected = new Set(states);
            map.classList.toggle("has-lens-scope", selected.size > 0);
            map.querySelectorAll<SVGGElement>(".territory-map-state").forEach((node) => node.classList.toggle("is-lens-selected", selected.has(stateCodeForGroup(node))));
          }

          export function MapSelectionGroupBridge() {
            const { dataset, config } = useCompassState();
            const { segments } = useSegments();
            const [mounted, setMounted] = useState(false);
            const [portalTarget, setPortalTarget] = useState<HTMLElement | null>(null);
            const [pickerOpen, setPickerOpen] = useState(false);
            const [lens, setLens] = useState<MapLensState>(EMPTY_MAP_LENS_STATE);
            const mapRef = useRef<Element | null>(null);
            const lensRef = useRef<MapLensState>(EMPTY_MAP_LENS_STATE);
            const pressRef = useRef<PointerPress | null>(null);

            useEffect(() => { setMounted(true); const stored = loadMapLensState(); lensRef.current = stored; setLens(stored); }, []);
            useEffect(() => { lensRef.current = lens; if (mapRef.current) syncLensHighlights(mapRef.current, lens.states); }, [lens]);

            const commitLens = useCallback((updater: (current: MapLensState) => MapLensState) => {
              setLens((current) => {
                const next = normalizeMapLensState(updater(current));
                lensRef.current = next;
                saveMapLensState(next);
                return next;
              });
            }, []);

            const toggleState = useCallback((state: string) => {
              if (!state) return;
              commitLens((current) => ({
                ...current,
                states: current.states.includes(state) ? current.states.filter((item) => item !== state) : [...current.states, state],
              }));
            }, [commitLens]);

            useEffect(() => {
              let observer: MutationObserver | null = null;
              let currentMap: Element | null = null;
              let pageObserver: MutationObserver | null = null;

              const detachMapEvents = () => {
                if (!currentMap) return;
                currentMap.removeEventListener("pointerdown", onPointerDown, true);
                currentMap.removeEventListener("pointermove", onPointerMove, true);
                currentMap.removeEventListener("pointerup", onPointerUp, true);
                currentMap.removeEventListener("pointercancel", onPointerCancel, true);
                currentMap.removeEventListener("keydown", onKeyDown, true);
              };

              const onPointerDown = (event: Event) => {
                const pointer = event as PointerEvent;
                const state = stateCodeFromTarget(pointer.target);
                pressRef.current = state ? { pointerId: pointer.pointerId, state, x: pointer.clientX, y: pointer.clientY, moved: false } : null;
              };
              const onPointerMove = (event: Event) => {
                const pointer = event as PointerEvent;
                const press = pressRef.current;
                if (!press || press.pointerId !== pointer.pointerId || press.moved) return;
                if (Math.hypot(pointer.clientX - press.x, pointer.clientY - press.y) >= 4) press.moved = true;
              };
              const onPointerUp = (event: Event) => {
                const pointer = event as PointerEvent;
                const press = pressRef.current;
                pressRef.current = null;
                if (!press || press.pointerId !== pointer.pointerId || press.moved) return;
                toggleState(press.state);
              };
              const onPointerCancel = () => { pressRef.current = null; };
              const onKeyDown = (event: Event) => {
                const keyboard = event as KeyboardEvent;
                if (keyboard.key !== "Enter" && keyboard.key !== " ") return;
                const state = stateCodeFromTarget(keyboard.target);
                if (!state) return;
                keyboard.preventDefault();
                keyboard.stopPropagation();
                toggleState(state);
              };

              const attach = () => {
                const map = document.querySelector(".territory-regional-map");
                const insight = document.querySelector<HTMLElement>(".territory-map-insight");
                setPortalTarget(insight);
                if (map === currentMap) return;
                observer?.disconnect();
                detachMapEvents();
                currentMap = map;
                mapRef.current = map;
                if (!map) return;
                syncPeerHighlights(map);
                syncLensHighlights(map, lensRef.current.states);
                map.addEventListener("pointerdown", onPointerDown, true);
                map.addEventListener("pointermove", onPointerMove, true);
                map.addEventListener("pointerup", onPointerUp, true);
                map.addEventListener("pointercancel", onPointerCancel, true);
                map.addEventListener("keydown", onKeyDown, true);
                observer = new MutationObserver(() => { syncPeerHighlights(map); syncLensHighlights(map, lensRef.current.states); });
                observer.observe(map, { subtree: true, attributes: true, attributeFilter: ["class"] });
              };

              attach();
              pageObserver = new MutationObserver(attach);
              pageObserver.observe(document.body, { childList: true, subtree: true });
              return () => { observer?.disconnect(); pageObserver?.disconnect(); detachMapEvents(); mapRef.current = null; };
            }, [toggleState]);

            useEffect(() => {
              const validIds = new Set(segments.map((segment) => segment.id));
              if (!lens.segmentIds.some((id) => !validIds.has(id))) return;
              commitLens((current) => ({ ...current, segmentIds: current.segmentIds.filter((id) => validIds.has(id)) }));
            }, [commitLens, lens.segmentIds, segments]);

            const activeSegments = useMemo(() => lens.segmentIds.map((id) => segments.find((segment) => segment.id === id)).filter((segment): segment is NonNullable<typeof segment> => Boolean(segment)), [lens.segmentIds, segments]);
            const availableSegments = useMemo(() => segments.filter((segment) => !lens.segmentIds.includes(segment.id)), [lens.segmentIds, segments]);
            const metrics = useMemo(() => {
              const next = new Map<string, { clients: number; value: number }>();
              if (!dataset) return next;
              for (const segment of segments) {
                const snapshot = buildSegmentSnapshot(segment, dataset, config);
                next.set(segment.id, { clients: snapshot.aggregate.clientCount, value: snapshot.aggregate.estimatedValue });
              }
              return next;
            }, [config, dataset, segments]);

            if (!mounted || !portalTarget) return null;
            const hasLens = activeSegments.length > 0 || lens.states.length > 0;

            return createPortal(<section className="map-segment-lens-panel" aria-label="Map segment lenses">
              <div className="map-lens-heading"><div><span className="compass-kicker">Map lens</span><strong>Segments</strong></div><button type="button" className={pickerOpen ? "is-active" : ""} onClick={() => setPickerOpen((open) => !open)} aria-label="Add a saved segment">+</button></div>
              {pickerOpen && <div className="map-lens-picker"><div><strong>Saved segments</strong><small>From Segment Manager</small></div>{availableSegments.length ? <div className="map-lens-picker-list">{availableSegments.map((segment) => {
                const stat = metrics.get(segment.id);
                return <button key={segment.id} type="button" className="map-lens-picker-card" style={{ "--segment-color": segment.color } as CSSProperties} onClick={() => { commitLens((current) => ({ ...current, segmentIds: [...current.segmentIds, segment.id] })); setPickerOpen(false); }}><span><SegmentIcon name={segment.icon} /></span><div><strong>{segment.title}</strong><small>{stat ? `${stat.clients} clients · ${compactMoney(stat.value)}` : "Saved segment"}</small></div></button>;
              })}</div> : <div className="map-lens-picker-empty">All saved segments are already on the map.</div>}<Link href="/segments/">Open Segment Manager</Link></div>}
              {activeSegments.length > 1 && <div className="map-lens-match"><span>Match</span><div role="group" aria-label="How selected segments combine"><button type="button" className={lens.matchMode === "all" ? "is-active" : ""} onClick={() => commitLens((current) => ({ ...current, matchMode: "all" }))}>ALL</button><button type="button" className={lens.matchMode === "any" ? "is-active" : ""} onClick={() => commitLens((current) => ({ ...current, matchMode: "any" }))}>ANY</button></div></div>}
              {activeSegments.length > 0 && <div className="map-lens-card-stack">{activeSegments.map((segment) => {
                const stat = metrics.get(segment.id);
                return <article key={segment.id} className="map-lens-card" style={{ "--segment-color": segment.color } as CSSProperties}><span className="map-lens-card-icon"><SegmentIcon name={segment.icon} /></span><div className="map-lens-card-copy"><strong>{segment.title}</strong><small>{stat ? `${stat.clients} client${stat.clients === 1 ? "" : "s"} · ${compactMoney(stat.value)}` : "Saved segment"}</small></div><button type="button" onClick={() => commitLens((current) => ({ ...current, segmentIds: current.segmentIds.filter((id) => id !== segment.id) }))} aria-label={`Remove ${segment.title} from map`}>×</button></article>;
              })}</div>}
              {lens.states.length > 0 && <div className="map-lens-where"><span>Where</span><div>{lens.states.map((state) => <button key={state} type="button" onClick={() => toggleState(state)}>{state}<b>×</b></button>)}</div></div>}
              {!activeSegments.length && !lens.states.length && <p className="map-lens-empty">Add a saved segment, or click states on the map to narrow where you want to look.</p>}
              {hasLens && <button type="button" className="map-lens-clear" onClick={() => commitLens(() => EMPTY_MAP_LENS_STATE)}>Clear map lens</button>}
            </section>, portalTarget);
          }
          EOF

          cat > src/app/v10929-polish.css <<'EOF'
          /* Client Compass v1.0.9.29 — reusable map lenses + unified page-title treatment */
          :is(.compass-admin-hero,.territory-map-header,.segment-page-header){min-height:76px;padding-top:4px!important;align-items:center}
          :is(.compass-admin-hero,.territory-map-header,.segment-page-header,.segment-detail-header) .compass-kicker{color:rgba(82,101,123,.38)!important;text-shadow:0 1px 0 rgba(255,255,255,.9)}
          :is(.compass-admin-hero,.territory-map-header,.segment-page-header,.segment-detail-header) h1{margin-top:2px!important;margin-bottom:3px!important;color:rgba(68,88,111,.27)!important;font-size:clamp(29px,2.8vw,39px)!important;font-weight:620!important;letter-spacing:-.035em!important;text-shadow:0 1px 0 rgba(255,255,255,.96),0 -1px 0 rgba(42,61,83,.13)}
          :is(.compass-admin-hero,.territory-map-header,.segment-page-header,.segment-detail-header) p{color:rgba(83,103,126,.52)!important;font-size:12px!important;text-shadow:0 1px 0 rgba(255,255,255,.8)}

          .map-segment-lens-panel{position:relative;margin-top:13px;padding-top:13px;border-top:1px solid rgba(55,82,112,.09);display:grid;gap:9px;min-height:0}
          .map-lens-heading{display:flex;align-items:center;justify-content:space-between;gap:10px}.map-lens-heading>div{display:grid;gap:1px}.map-lens-heading>div>strong{color:#345774;font-size:13px;font-weight:900}.map-lens-heading>button{width:30px;height:30px;border:1px solid rgba(50,82,113,.13);border-radius:10px;background:#f4f7fa;color:#53728e;font-size:20px;line-height:1;cursor:pointer;box-shadow:0 4px 10px rgba(38,66,94,.04);transition:.15s ease}.map-lens-heading>button:hover,.map-lens-heading>button.is-active{background:#fff;border-color:rgba(55,108,158,.28);color:#2767a5;transform:translateY(-1px)}
          .map-lens-match{display:flex;align-items:center;justify-content:space-between;gap:10px}.map-lens-match>span,.map-lens-where>span{color:#8797a8;font-size:8.5px;font-weight:900;letter-spacing:.09em;text-transform:uppercase}.map-lens-match>div{display:inline-flex;padding:2px;border:1px solid rgba(55,82,112,.08);border-radius:999px;background:#eef3f8}.map-lens-match button{border:0;border-radius:999px;background:transparent;color:#8493a3;padding:4px 9px;font-size:8.5px;font-weight:900;cursor:pointer}.map-lens-match button.is-active{background:#fff;color:#2f6598;box-shadow:0 2px 7px rgba(37,70,104,.08)}
          .map-lens-card-stack{display:grid;gap:7px;max-height:190px;overflow-y:auto;padding-right:2px}.map-lens-card{min-width:0;display:grid;grid-template-columns:34px minmax(0,1fr) 26px;align-items:center;gap:9px;padding:8px 8px 8px 9px;border:1px solid color-mix(in srgb,var(--segment-color) 20%,#dce5ee);border-radius:12px;background:linear-gradient(135deg,color-mix(in srgb,var(--segment-color) 6%,#fff),#fff 62%);box-shadow:0 6px 15px rgba(30,57,84,.04)}
          .map-lens-card-icon,.map-lens-picker-card>span{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:color-mix(in srgb,var(--segment-color) 13%,#fff);color:var(--segment-color);border:1px solid color-mix(in srgb,var(--segment-color) 18%,transparent)}.map-lens-card-icon svg,.map-lens-picker-card>span svg{width:17px;height:17px}.map-lens-card-copy{min-width:0;display:grid;gap:2px}.map-lens-card-copy strong{min-width:0;color:#294b68;font-size:10.5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.map-lens-card-copy small{color:#8b9aaa;font-size:8.5px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.map-lens-card>button{width:24px;height:24px;border:0;border-radius:8px;background:transparent;color:#9aa8b6;font-size:15px;cursor:pointer;opacity:.2;transition:.14s ease}.map-lens-card:hover>button,.map-lens-card>button:focus-visible{opacity:1;background:#f0f4f7;color:#607a92}
