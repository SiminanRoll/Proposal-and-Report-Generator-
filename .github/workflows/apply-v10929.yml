          .map-lens-where{display:grid;gap:6px}.map-lens-where>div{display:flex;gap:5px;flex-wrap:wrap}.map-lens-where button{display:inline-flex;align-items:center;gap:5px;border:1px solid rgba(52,101,147,.15);border-radius:999px;background:#f0f6fb;color:#3d6b95;padding:4px 7px 4px 9px;font-size:8.5px;font-weight:900;cursor:pointer}.map-lens-where button b{font-size:10px;color:#7c95ac}.map-lens-empty{margin:0;padding:7px 1px;color:#99a6b4;font-size:8.7px;line-height:1.45;font-weight:700}.map-lens-clear{justify-self:start;border:0;background:transparent;color:#8a9aaa;padding:1px 0;font-size:8.5px;font-weight:850;cursor:pointer}.map-lens-clear:hover{color:#4d6f8d;text-decoration:underline}
          .territory-regional-map.has-lens-scope .territory-map-state:not(.is-lens-selected):not(.is-active){opacity:.32;filter:saturate(.5)}.territory-map-state.is-lens-selected{opacity:1!important;filter:saturate(1.08) brightness(1.02)}.territory-map-state.is-lens-selected .territory-map-state-outline{stroke:#2d76b8;stroke-width:3;filter:drop-shadow(0 2px 4px rgba(31,91,145,.22))}.territory-map-state.is-lens-selected .territory-map-region-label{fill:#244e73}
