name: v1.2.86 Ninja Hardware Fields Check

on:
  push:
    branches:
      - client-compass-v1286-ninja-cpu

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client-compass-v1286-ninja-cpu
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Focused Ninja hardware regressions
        run: node --test tests/v1286-ninja-hardware-fields.test.mjs
      - name: Existing Compass/report regressions
        run: node --test tests/compass-phase2.test.mjs tests/device-inventory-ordering.test.mjs tests/client-report-presentation.test.mjs
      - run: npm run build
      - name: Full test suite
        run: npm test
