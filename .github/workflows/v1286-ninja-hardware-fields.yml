name: v1.2.86 Ninja Hardware Fields Check

on:
  push:
    branches:
      - client-compass-v1286-ninja-cpu

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client-compass-v1286-ninja-cpu
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Ninja hardware parser improvements
        run: python scripts/apply-v1286-ninja-hardware-fields.py
      - run: npm ci
      - run: npm run typecheck
      - name: Focused Ninja hardware regressions
        run: node --test tests/v1286-ninja-hardware-fields.test.mjs
      - name: Existing Compass/report regressions
        run: node --test tests/compass-phase2.test.mjs tests/device-inventory-ordering.test.mjs tests/client-report-presentation.test.mjs
      - run: npm run build
      - name: Full test suite
        run: npm test
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src/lib/app-version.ts src/lib/compass/headers.ts src/lib/compass/import.ts src/lib/compass/types.ts src/lib/compass/engine.ts src/lib/compass/generator-bridge.ts tests/v1286-ninja-hardware-fields.test.mjs
          git commit -m "Preserve Ninja CPU and hardware fields [v1286-bot]"
          git push origin HEAD:client-compass-v1286-ninja-cpu
