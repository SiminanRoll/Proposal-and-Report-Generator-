name: v1.1.26 lifecycle threshold fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[v1126-lifecycle-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply lifecycle policy fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"{path}: expected text not found: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          def replace_regex_once(path, pattern, replacement):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: expected one regex match, found {count}")
              p.write_text(updated, encoding="utf-8")

          # Compass defaults: 4+ Plan Soon, 5+ Replace Now.
          replace_once("src/lib/compass/config.ts", "    workstationPlanSoonYears: 5,", "    workstationPlanSoonYears: 4,")
          replace_once("src/lib/compass/config.ts", "    workstationReplaceNowYears: 7,", "    workstationReplaceNowYears: 5,")
          replace_once("src/lib/compass/config.ts", "    workstationExpiredWarrantyReplaceYears: 6,", "    workstationExpiredWarrantyReplaceYears: 5,")

          # Stop legacy normalization from silently converting the intended 4/5 values to 5/7.
          # Only migrate the exact old default tuple; deliberate custom settings stay intact.
          replace_regex_once(
              "src/lib/compass/config.ts",
              r"  // v1\.2\.2 stored the original 4/5-year workstation defaults.*?\n  if \(!Array\.isArray\(candidate\.cards\)\) \{.*?\n  \}\n",
              textwrap.dedent("""\
                // v1.1.26 restores the intended 4/5-year workstation lifecycle contract.
                // Migrate only the exact prior 5/7/6 default tuple; preserve deliberate custom thresholds.
                const priorFiveSevenDefaults =
                  normalizedThresholds.workstationPlanSoonYears === 5
                  && normalizedThresholds.workstationReplaceNowYears === 7
                  && normalizedThresholds.workstationExpiredWarrantyReplaceYears === 6;
                if (priorFiveSevenDefaults) {
                  normalizedThresholds.workstationPlanSoonYears = 4;
                  normalizedThresholds.workstationReplaceNowYears = 5;
                  normalizedThresholds.workstationExpiredWarrantyReplaceYears = 5;
                }
              """),
          )

          # Shared report/review technical truth must use the same settings contract.
          replace_once("src/lib/technical-truth/index.ts", "export const TECHNICAL_TRUTH_VERSION = 1;", "export const TECHNICAL_TRUTH_VERSION = 2;")
          replace_once("src/lib/technical-truth/index.ts", "  workstationPlanSoonYears: 5,", "  workstationPlanSoonYears: 4,")
          replace_once("src/lib/technical-truth/index.ts", "  workstationReplaceNowYears: 7,", "  workstationReplaceNowYears: 5,")
          replace_once("src/lib/technical-truth/index.ts", "  workstationExpiredWarrantyReplaceYears: 6,", "  workstationExpiredWarrantyReplaceYears: 5,")
          replace_once(
              "src/lib/technical-truth/index.ts",
              '  const months = technicalFutureMonths(input.warrantyEnd, referenceDate);\n  if (age >= thresholds.workstationPlanSoonYears || (age >= 4 && months !== null && months >= 0 && months <= thresholds.warrantyPlanningMonths)) return "plan-soon";',
              '  if (age >= thresholds.workstationPlanSoonYears) return "plan-soon";',
          )

          # Force existing Compass calculations to be re-evaluated under the corrected policy.
          replace_once("src/lib/compass/engine.ts", "export const COMPASS_CALCULATION_VERSION = 5;", "export const COMPASS_CALCULATION_VERSION = 6;")

          # Sequential release bump.
          replace_once("src/lib/app-version.ts", 'export const APP_VERSION = "1.1.25";', 'export const APP_VERSION = "1.1.26";')
          replace_once("package.json", '"version": "1.1.25"', '"version": "1.1.26"')

          # Existing lifecycle summaries reflect the old 5/7 policy in two fixtures.
          p = Path("tests/lifecycle-policy.test.mjs")
          text = p.read_text(encoding="utf-8")
          old = "    dueSoon: 2,\n    overdue: 0,"
          if text.count(old) != 2:
              raise SystemExit(f"tests/lifecycle-policy.test.mjs: expected 2 old summary blocks, found {text.count(old)}")
          p.write_text(text.replace(old, "    dueSoon: 1,\n    overdue: 1,"), encoding="utf-8")

          Path("tests/v1126-workstation-lifecycle-thresholds.test.mjs").write_text(textwrap.dedent(r'''
            import test from "node:test";
            import assert from "node:assert/strict";
            import { transpileTestModule } from "./test-transpile-helper.mjs";

            test("v1.1.26 restores 4-year Plan Soon and 5-year Replace Now defaults", async () => {
              const { DEFAULT_COMPASS_CONFIG, normalizeCompassConfig } = await transpileTestModule("../src/lib/compass/config.ts", import.meta.url, { prefix: "v1126-config" });
              assert.equal(DEFAULT_COMPASS_CONFIG.thresholds.workstationPlanSoonYears, 4);
              assert.equal(DEFAULT_COMPASS_CONFIG.thresholds.workstationReplaceNowYears, 5);
              assert.equal(DEFAULT_COMPASS_CONFIG.thresholds.workstationExpiredWarrantyReplaceYears, 5);

              const oldDefaults = structuredClone(DEFAULT_COMPASS_CONFIG);
              oldDefaults.thresholds.workstationPlanSoonYears = 5;
              oldDefaults.thresholds.workstationReplaceNowYears = 7;
              oldDefaults.thresholds.workstationExpiredWarrantyReplaceYears = 6;
              const migrated = normalizeCompassConfig(oldDefaults);
              assert.equal(migrated.thresholds.workstationPlanSoonYears, 4);
              assert.equal(migrated.thresholds.workstationReplaceNowYears, 5);
              assert.equal(migrated.thresholds.workstationExpiredWarrantyReplaceYears, 5);

              const custom = structuredClone(DEFAULT_COMPASS_CONFIG);
              custom.thresholds.workstationPlanSoonYears = 6;
              custom.thresholds.workstationReplaceNowYears = 8;
              custom.thresholds.workstationExpiredWarrantyReplaceYears = 8;
              const preserved = normalizeCompassConfig(custom);
              assert.equal(preserved.thresholds.workstationPlanSoonYears, 6);
              assert.equal(preserved.thresholds.workstationReplaceNowYears, 8);
              assert.equal(preserved.thresholds.workstationExpiredWarrantyReplaceYears, 8);
            });

            test("shared lifecycle engine obeys 4/5 defaults and custom workstation thresholds", async () => {
              const { DEFAULT_TECHNICAL_THRESHOLDS, classifyTechnicalLifecycle } = await transpileTestModule("../src/lib/technical-truth/index.ts", import.meta.url, { prefix: "v1126-truth" });
              const base = { deviceType: "physical-workstation", isVirtual: false, model: "Dell OptiPlex 7090" };
              assert.equal(classifyTechnicalLifecycle({ ...base, ageYears: 3.99 }), "current");
              assert.equal(classifyTechnicalLifecycle({ ...base, ageYears: 4.0 }), "plan-soon");
              assert.equal(classifyTechnicalLifecycle({ ...base, ageYears: 4.99 }), "plan-soon");
              assert.equal(classifyTechnicalLifecycle({ ...base, ageYears: 5.0 }), "replace-now");

              const custom = { ...DEFAULT_TECHNICAL_THRESHOLDS, workstationPlanSoonYears: 6, workstationReplaceNowYears: 8, workstationExpiredWarrantyReplaceYears: 8 };
              assert.equal(classifyTechnicalLifecycle({ ...base, ageYears: 4.5, warrantyEnd: "2099-01-01" }, custom), "current");
              assert.equal(classifyTechnicalLifecycle({ ...base, ageYears: 6.0, warrantyEnd: "2099-01-01" }, custom), "plan-soon");
              assert.equal(classifyTechnicalLifecycle({ ...base, ageYears: 8.0, warrantyEnd: "2099-01-01" }, custom), "replace-now");
            });
          ''').lstrip(), encoding="utf-8")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify v1.1.26
        run: npm run verify

      - name: Commit verified fix to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v1126-lifecycle-fix.yml
          git add src/lib/compass/config.ts src/lib/technical-truth/index.ts src/lib/compass/engine.ts src/lib/app-version.ts package.json tests/lifecycle-policy.test.mjs tests/v1126-workstation-lifecycle-thresholds.test.mjs
          git commit -m "fix: restore 4/5 workstation lifecycle [v1126-lifecycle-applied]"
          git push origin HEAD:main
