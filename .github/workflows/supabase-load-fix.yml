name: Supabase Load Fix

on:
  push:
    branches:
      - fix/supabase-task-write-load

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/supabase-task-write-load
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply targeted ledger fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lib/compass/captains-log-bridge.ts')
          text = path.read_text()

          old_ids = '''async function companyIdsForCompassClients(clientIds: string[]): Promise<Map<string, string>> {
            const { captainsLogCloudRest } = await import("./captains-log-cloud");
            const wanted = new Set(clientIds.map(text).filter(Boolean));
            if (!wanted.size) return new Map();
            const rows = await captainsLogCloudRest<Array<{ company_id?: string; external_id?: string }>>("GET", "company_external_ids", undefined, {
              select: "company_id,external_id",
              source: "eq.client_compass",
              limit: String(MAX_ID_ROWS),
            });
            const result = new Map<string, string>();
            for (const row of Array.isArray(rows) ? rows : []) {
              const externalId = text(row.external_id);
              const companyId = text(row.company_id);
              if (wanted.has(externalId) && isUuid(companyId)) result.set(externalId, companyId);
            }
            return result;
          }
          '''
          new_ids = '''async function companyIdsForCompassClients(clientIds: string[]): Promise<Map<string, string>> {
            const { captainsLogCloudRest } = await import("./captains-log-cloud");
            const wanted = [...new Set(clientIds.map(text).filter(Boolean))];
            if (!wanted.length) return new Map();
            const result = new Map<string, string>();
            const chunkSize = 100;
            for (let offset = 0; offset < wanted.length; offset += chunkSize) {
              const chunk = wanted.slice(offset, offset + chunkSize);
              const rows = await captainsLogCloudRest<Array<{ company_id?: string; external_id?: string }>>("GET", "company_external_ids", undefined, {
                select: "company_id,external_id",
                source: "eq.client_compass",
                external_id: `in.(${chunk.map((id) => JSON.stringify(id)).join(",")})`,
                limit: String(chunk.length),
              });
              for (const row of Array.isArray(rows) ? rows : []) {
                const externalId = text(row.external_id);
                const companyId = text(row.company_id);
                if (chunk.includes(externalId) && isUuid(companyId)) result.set(externalId, companyId);
              }
            }
            return result;
          }
          '''
          if old_ids not in text:
              raise SystemExit('companyIdsForCompassClients source block not found')
          text = text.replace(old_ids, new_ids, 1)

          anchor = '''async function companyIdsForCompassClients(clientIds: string[]): Promise<Map<string, string>> {'''
          targeted = '''async function loadSupabaseLedgerForCompanyIds(companyIds: string[]): Promise<SupabaseLedgerSnapshot> {
            const unique = [...new Set(companyIds.map(text).filter(isUuid))];
            if (!unique.length) return { taskEvents: [], callEvents: [], loadedAt: Date.now() };

            const taskEvents: SupabaseTaskEventRow[] = [];
            const callEvents: SupabaseCallModeEventRow[] = [];
            const chunkSize = 40;
            for (let offset = 0; offset < unique.length; offset += chunkSize) {
              const chunk = unique.slice(offset, offset + chunkSize);
              const companyFilter = `in.(${chunk.join(",")})`;
              const [tasks, calls] = await Promise.all([
                fetchAllRows<SupabaseTaskEventRow>("task_events", {
                  select: "event_id,event_type,local_task_id,task_title,tag,parking_lot,done,occurred_at,inserted_at,metadata,company_id",
                  company_id: companyFilter,
                  order: "inserted_at.asc,event_id.asc",
                }),
                fetchAllRows<SupabaseCallModeEventRow>("app_events", {
                  select: "event_id,event_type,payload,created_at,inserted_at,company_id",
                  event_type: "eq.call_mode_event",
                  company_id: companyFilter,
                  order: "inserted_at.asc,event_id.asc",
                }),
              ]);
              taskEvents.push(...tasks);
              callEvents.push(...calls);
            }
            return { taskEvents, callEvents, loadedAt: Date.now() };
          }

          '''
          if anchor not in text:
              raise SystemExit('targeted ledger insertion anchor not found')
          text = text.replace(anchor, targeted + anchor, 1)

          old_sync = '''export async function syncClientFromCaptainsLog(
            clientId: string,
            company: string,
            _timeoutMs = 7000,
            aliases: string[] = [],
          ): Promise<CaptainsLogClientSyncResult> {
            const [input] = await hydrateClientCompanyIds([{ clientId: text(clientId), company: text(company), aliases }]);
            const ledger = await loadSupabaseLedger(false);
            return buildClientSnapshotsFromLedger(ledger, [input])[0] ?? {
              ok: false,
              client_id: clientId,
              requested_company: company,
              synced_at: "",
              error: "No Supabase history was returned.",
            };
          }

          export async function syncClientsFromCaptainsLog(
            clients: Array<{ clientId: string; company: string; aliases?: string[]; companyId?: string }>,
            _timeoutMs = 24000,
          ): Promise<CaptainsLogBatchSyncResult> {
            const cleaned = clients
              .map((client) => ({
                clientId: text(client.clientId),
                company: text(client.company),
                aliases: Array.isArray(client.aliases) ? client.aliases.filter(Boolean) : [],
                companyId: text(client.companyId),
              }))
              .filter((client) => client.clientId && client.company);
            if (!cleaned.length) return { results: [], pendingBatches: 0, totalBatches: 0 };
            const hydrated = await hydrateClientCompanyIds(cleaned);
            const ledger = await loadSupabaseLedger(true);
            return { results: buildClientSnapshotsFromLedger(ledger, hydrated), pendingBatches: 0, totalBatches: 1 };
          }
          '''
          new_sync = '''export async function syncClientFromCaptainsLog(
            clientId: string,
            company: string,
            _timeoutMs = 7000,
            aliases: string[] = [],
          ): Promise<CaptainsLogClientSyncResult> {
            const [input] = await hydrateClientCompanyIds([{ clientId: text(clientId), company: text(company), aliases }]);
            const ledger = await loadSupabaseLedgerForCompanyIds(input?.companyId ? [input.companyId] : []);
            return buildClientSnapshotsFromLedger(ledger, [input])[0] ?? {
              ok: false,
              client_id: clientId,
              requested_company: company,
              synced_at: "",
              error: "No Supabase history was returned.",
            };
          }

          export async function syncClientsFromCaptainsLog(
            clients: Array<{ clientId: string; company: string; aliases?: string[]; companyId?: string }>,
            _timeoutMs = 24000,
          ): Promise<CaptainsLogBatchSyncResult> {
            const cleaned = clients
              .map((client) => ({
                clientId: text(client.clientId),
                company: text(client.company),
                aliases: Array.isArray(client.aliases) ? client.aliases.filter(Boolean) : [],
                companyId: text(client.companyId),
              }))
              .filter((client) => client.clientId && client.company);
            if (!cleaned.length) return { results: [], pendingBatches: 0, totalBatches: 0 };
            const hydrated = await hydrateClientCompanyIds(cleaned);
            const ledger = await loadSupabaseLedgerForCompanyIds(hydrated.map((client) => client.companyId || ""));
            return { results: buildClientSnapshotsFromLedger(ledger, hydrated), pendingBatches: 0, totalBatches: 1 };
          }
          '''
          if old_sync not in text:
              raise SystemExit('sync source block not found')
          text = text.replace(old_sync, new_sync, 1)
          path.write_text(text)

          test = Path('tests/supabase-load-regression.test.mjs')
          test.write_text(r'''import test from "node:test";
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";

          test("routine Captain's Log sync never loads the full historical ledger", async () => {
            const source = await readFile("src/lib/compass/captains-log-bridge.ts", "utf8");
            const syncStart = source.indexOf("export async function syncClientFromCaptainsLog");
            const mergeStart = source.indexOf("export async function sendCoordinationCallToCaptainsLogReliable");
            const routine = source.slice(syncStart, mergeStart);
            assert.match(routine, /loadSupabaseLedgerForCompanyIds/);
            assert.doesNotMatch(routine, /loadSupabaseLedger\(/);
            assert.match(source, /company_id: companyFilter/);
            assert.match(source, /order: "inserted_at\.asc,event_id\.asc"/);
          });

          test("automatic durable protection does not post a cloud snapshot on every local save", async () => {
            const source = await readFile("src/components/durable-storage-runtime.tsx", "utf8");
            assert.match(source, /CLOUD_SAVE_INTERVAL_MS = 30 \* 60_000/);
            assert.match(source, /saveDurableDatabaseMirrorNow\(\)/);
            assert.match(source, /cloudDirty/);
            assert.doesNotMatch(source, /Promise\.allSettled/);
          });

          test("Add task skips the redundant connection preflight", async () => {
            const source = await readFile("src/components/client-tracked-action.tsx", "utf8");
            assert.doesNotMatch(source, /verifyCaptainsLogTaskConnection/);
            assert.match(source, /writeCoordinationTaskToCaptainsLog\(request\)/);
          });

          test("cross-device startup establishes a baseline without rebuilding every client", async () => {
            const source = await readFile("src/components/captains-log-cross-device-runtime.tsx", "utf8");
            const marker = source.indexOf("if (!cursor || cursor.fingerprint !== currentFingerprint");
            const end = source.indexOf("const nextCursor", marker);
            const baseline = source.slice(marker, end);
            assert.doesNotMatch(baseline, /refreshClients\(/);
            assert.match(source, /auto-sync\.v6/);
          });
          ''')
          PY
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Supabase load regression
        run: node --test tests/supabase-load-regression.test.mjs
      - name: Build
        run: npm run build
      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/compass/captains-log-bridge.ts tests/supabase-load-regression.test.mjs
          git commit -m "Target Captain's Log sync by company UUID"
          git push origin HEAD:fix/supabase-task-write-load
