name: One-shot Signal Lead-first List

on:
  push:
    paths:
      - '.github/workflows/one-shot-signal-lead-first.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply lead-first ordering patch
        run: python .github/patch_signal_lead_first.py
      - name: Install dependencies
        run: npm ci
      - name: Verify lead-first mixed list
        run: node --test tests/signal-lead-first-ordering.test.mjs
      - name: Verify signal dashboard contracts
        run: node --test tests/signal-dashboard-polling.test.mjs tests/signal-dashboard-version-contract.test.mjs tests/signal-map-buyer-reply-lanes.test.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Verify diff
        run: git diff --check
      - name: Commit release and clean staging helpers
        run: |
          git config user.name "Signal Intelligence Release Bot"
          git config user.email "actions@github.com"
          git rm .github/patch_signal_lead_first.py .github/workflows/one-shot-signal-lead-first.yml
          git add public/captains-log-dashboard/dashboard-runtime-fixes.js tests/signal-lead-first-ordering.test.mjs
          git diff --cached --check
          git commit -m "fix(signals): show leads before replies in mixed lists"
          git push origin HEAD:main
