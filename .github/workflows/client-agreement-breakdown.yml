name: Client Agreement Breakdown
on:
  pull_request:
    paths:
      - "src/lib/outcomes/agreement-breakdown*.ts"
      - "src/lib/outcomes/export-html.ts"
      - "src/lib/projects/types.ts"
      - "src/components/agreement-breakdown*.tsx"
      - "src/components/outcome-experience.tsx"
      - "src/app/globals.css"
      - "tests/v132-agreement-breakdown.test.mjs"
      - ".github/workflows/client-agreement-breakdown.yml"
  push:
    branches: ["feature/optional-a360-agreement-breakdown-20261109"]
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Agreement breakdown data and reporting regressions
        run: node --test tests/v132-agreement-breakdown.test.mjs
      - run: npm run build
