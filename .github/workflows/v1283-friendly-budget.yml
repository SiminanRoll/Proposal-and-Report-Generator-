name: v1.2.83 Friendly Budget Check

on:
  push:
    branches:
      - client-compass-v1283-friendly-budget

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client-compass-v1283-friendly-budget
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply friendly budget redesign
        run: python scripts/apply-v1283-friendly-budget.py
      - run: npm ci
      - run: npm run typecheck
      - name: Focused budget regressions
        run: node --test tests/v1283-friendly-budget.test.mjs
      - run: npm run build
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src/lib/app-version.ts src/components/technology-budget-outlook.tsx src/lib/outcomes/technology-budget-outlook.ts tests/v1283-friendly-budget.test.mjs
          git commit -m "Redesign technology budget as friendly planning outlook [v1283-bot]"
          git push origin HEAD:client-compass-v1283-friendly-budget
