name: v1.2.82 PDF Budget and HIPAA Check

on:
  push:
    branches:
      - client-compass-v1282-pdf-budget-hipaa

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: client-compass-v1282-pdf-budget-hipaa
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply PDF fixes
        run: python scripts/apply-v1282-pdf-fixes.py
      - run: npm ci
      - run: npm run typecheck
      - name: Focused PDF regressions
        run: node --test tests/v1282-pdf-budget-hipaa.test.mjs tests/v1281-hipaa-answer-colors.test.mjs tests/v1280-red-budget.test.mjs
      - run: npm run build
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src/lib/app-version.ts src/lib/outcomes/export-html.ts src/lib/outcomes/technology-budget-outlook.ts tests/v1282-pdf-budget-hipaa.test.mjs
          git commit -m "Fix portrait PDF budget and HIPAA colors [v1282-bot]"
          git push origin HEAD:client-compass-v1282-pdf-budget-hipaa
