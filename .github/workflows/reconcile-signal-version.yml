name: Reconcile Signal Intelligence Version

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-signal-version.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reconcile dashboard release metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from datetime import datetime, timezone

          root = Path('public/captains-log-dashboard')
          index = root / 'index.html'
          text = index.read_text(encoding='utf-8')
          old = '1.2.80'
          new = '1.2.87'
          if old not in text and new not in text:
              raise SystemExit('Neither expected old nor new dashboard version found in index.html')
          text = text.replace(old, new).replace('· 2026-08-23', '· 2026-08-26')
          index.write_text(text, encoding='utf-8')

          version_path = root / 'version.json'
          data = json.loads(version_path.read_text(encoding='utf-8'))
          data['version'] = new
          data['released_at'] = datetime.now(timezone.utc).isoformat(timespec='seconds')
          data['release'] = 'performance-and-version-reconciliation'
          version_path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')

          test = Path('tests/signal-dashboard-version-contract.test.mjs')
          test.write_text('''import test from "node:test";\nimport assert from "node:assert/strict";\nimport { readFile } from "node:fs/promises";\n\ntest("Signal Intelligence uses one release version for manifest, shell, and asset cache keys", async () => {\n  const version = JSON.parse(await readFile("public/captains-log-dashboard/version.json", "utf8"));\n  const html = await readFile("public/captains-log-dashboard/index.html", "utf8");\n  const escaped = version.version.replaceAll(".", "\\\\.");\n\n  assert.equal(version.version, "1.2.87");\n  assert.equal(version.release, "performance-and-version-reconciliation");\n  assert.match(html, new RegExp(`data-dashboard-version="${escaped}"`));\n  assert.match(html, new RegExp(`<b>v${escaped}</b>`));\n  assert.doesNotMatch(html, /1\\.2\\.80/);\n\n  const cacheVersions = [...html.matchAll(/[?&]v=([0-9.]+)/g)].map(match => match[1]);\n  assert.ok(cacheVersions.length >= 10, "expected versioned dashboard assets");\n  assert.deepEqual([...new Set(cacheVersions)], [version.version]);\n});\n''', encoding='utf-8')
          PY
      - name: Focused Signal regressions
        run: node --test tests/signal-dashboard-polling.test.mjs tests/signal-dashboard-version-contract.test.mjs
      - run: npm run typecheck
      - run: npm run build
      - name: Commit reconciled release
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "Signal Intelligence release metadata already reconciled."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/captains-log-dashboard/index.html public/captains-log-dashboard/version.json tests/signal-dashboard-version-contract.test.mjs
          git commit -m "release: reconcile Signal Intelligence v1.2.87"
          git push
